services:
  claude-proxy:
    image: node:22-alpine
    working_dir: /app
    # The proxy has no runtime dependencies — package.json declares none and the
    # server requires only node builtins — so there is nothing to install here.
    # The install that used to run did have an effect, though: /app is a bind
    # mount, so --only=production pruned jest, supertest and nock from the host's
    # node_modules on every container start, and npm test then failed with
    # "Cannot find module 'nock'" until you reinstalled.
    command: node server/server.js
    ports:
      - "42069:42069"
    volumes:
      - ~/.claude:/root/.claude
      - ~/.claude-code-proxy:/root/.claude-code-proxy
      - .:/app
    environment:
      - NODE_ENV=production
      # Set PROXY_API_KEY in your shell (or .env) to require it from clients.
      - PROXY_API_KEY=${PROXY_API_KEY:-}
      # AUTH_ROUTES_ENABLED=false stops /auth/* being served at all.
      - AUTH_ROUTES_ENABLED=${AUTH_ROUTES_ENABLED:-}

